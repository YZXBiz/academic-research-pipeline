[project]
name = "dagster_experiment"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "dagster-duckdb>=0.29",
    "dagster-mlflow>=0.29",
    "duckdb>=1.4",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pyyaml>=6",
    "mlflow>=3.0",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "numpy>=2.0",
    "huggingface-hub>=0.29",
    "datasets>=3.0",
    "autogluon-tabular[catboost,lightgbm,xgboost]>=1.5",
    "betacal>=1.1",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "pytest>=9",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
registry_modules = [
    "pipeline.components.*",
]


