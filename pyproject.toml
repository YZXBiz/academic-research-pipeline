[project]
name = "academic-pipeline"
version = "2.5.0"
description = "PydanticAI-based academic research pipeline with 35 agents, pydantic-graph orchestration, and Logfire observability"
readme = {text = "PydanticAI academic research pipeline", content-type = "text/plain"}
license = "MIT"
authors = [
    { name = "Jackson Yang" },
]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai[anthropic,logfire]>=0.2.0",
    "pydantic-graph>=0.2.0",
    "logfire>=3.0.0",
    "pydantic-settings>=2.13.1",
    "httpx>=0.27.0",
    # defusedxml: kept as explicit pin per PRD §6.12.T7 option (a) —
    # transitive consumer (py-serializable via cyclonedx via pip-audit)
    # exists, explicit pin guards against future implicit-removal regression.
    "defusedxml>=0.7.1",
    "typer>=0.24.1",
    "exa-py>=1.0",
    "truststore>=0.10",
    "pydantic-ai-skills>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=6.0",
    "ruff>=0.4",
    "pre-commit>=4.0",
    "basedpyright>=1.1",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
]

[project.scripts]
academic-pipeline = "academic_pipeline.cli:app"

[project.urls]
Homepage = "https://github.com/YZXBiz/academic-research-pipeline"
Repository = "https://github.com/YZXBiz/academic-research-pipeline"
Documentation = "https://github.com/YZXBiz/academic-research-pipeline#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_pipeline"]

[tool.hatch.build.targets.wheel.sources]
"src/academic_pipeline" = "academic_pipeline"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src/academic_pipeline", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PGH",    # pygrep-hooks
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "D",      # pydocstyle — enforce docstrings
]
ignore = [
    "T201",   # print statements (used in CLI/dashboard output)
    "ARG001", # unused function arguments (common in node signatures)
    "D100",   # missing docstring in public module (init files etc)
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method (__repr__ etc)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "RET504", # unnecessary assignment before return
    "B905",   # zip strict (py3.10+)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["academic_pipeline"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PT001", "PT011", "D", "RUF012", "E402"]
"src/academic_pipeline/models/*" = ["TCH001"]
"src/academic_pipeline/state/*" = ["TCH002"]
# pydantic-graph TypeAdapter resolves string annotations at runtime via the
# module's globals; moving these imports into TYPE_CHECKING would break
# snapshot serialization. Comments inside state.py document this.
# TCH001 = old name (pre-commit pinned ruff 0.4); TC001 = new name (local ruff).
"src/academic_pipeline/pipeline/state.py" = ["TCH001", "TCH002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# Prepend src/ to sys.path so `import academic_pipeline` works under Python
# 3.13, which silently skips underscore-prefixed .pth files (hatchling's
# editable-install mechanism uses one). This makes pytest independent of
# the editable-install workaround in the Makefile.
pythonpath = ["src"]
markers = [
    "medium: integration tests — localhost Docker, < 5 min",
    "large: e2e tests — real APIs, real LLM calls",
]
addopts = "-m 'not medium and not large'"

[tool.coverage.run]
source = ["academic_pipeline"]
omit = ["src/academic_pipeline/__pycache__/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # allow assert in production code (used by pydantic)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
